{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <title>{% block title %}Reconnect{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/bulma.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="site-body">
  {% include "components/header.html" %}
  <main class="site-main">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>
  {% include "components/footer.html" %}
  <script src="{% static 'js/header.js' %}" defer></script>
  <script src="{% static 'js/filters.js' %}" defer></script>
  <script src="{% static 'js/footer.js' %}" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
