{# Feed switcher, sits inside the filter bar. Expects active_feed ("dynamic", "newest" or "popular") #}
<nav class="feed-tabs" aria-label="Article feeds">
  <a href="{% url 'home' %}" {% if active_feed == "dynamic" %}aria-current="page"{% endif %}>Dynamic</a>
  <a href="{% url 'newest' %}" {% if active_feed == "newest" %}aria-current="page"{% endif %}>Newest</a>
  <a href="{% url 'popular' %}" {% if active_feed == "popular" %}aria-current="page"{% endif %}>Popular</a>
</nav>
