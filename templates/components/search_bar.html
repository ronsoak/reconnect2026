{% load search_tags %}
<form method="get" action="{% url 'search' %}" role="search" class="site-search">
  <label class="visually-hidden" for="site-search-input">Search articles</label>
  <div class="site-search__control">
    <input class="input site-search__input" id="site-search-input" type="search" name="q"
           placeholder="{% search_placeholder %}" value="{{ query|default:'' }}">
    <button class="button site-search__button" type="submit">Search</button>
  </div>
</form>
